[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allostatik"
version = "0.3.5"
description = "Installer for Allostatik — a folder of canonical context files plus session routines that keep the context your AI works from sharp, consistent, and current. `allostatik init ./your-project` places the real template files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["allostatik", "claude", "cursor", "ai", "context", "configuration", "scaffold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/allostatik/allostatik"
Issues = "https://github.com/allostatik/allostatik/issues"

[project.scripts]
allostatik = "allostatik.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["allostatik"]
include-package-data = true

[tool.setuptools.package-data]
allostatik = ["templates/**/*"]
